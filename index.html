<!DOCTYPE html>
<html>
  <head>
    <title>YNG3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="shortcut icon" href="logo.ico" type="image/x-icon">
    <style>
      body {
        background-color: #000;
        color: #fff;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }

      h1 {
        font-size: 4em;
        margin-top: 100px;
        letter-spacing: 5px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      p {
        font-size: 1.5em;
        margin-top: 30px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      a {
        color: #fff;
        text-decoration: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      }

      .logo {
        height: 100px; /* adjust the height to your desired size */
        width: auto;
      }

      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: .5em;
        padding: 10px 0;
        text-align: center;
      }

      .footer p {
        margin: 0;
        padding: 0;
        line-height: 1;
      }

      .center {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
      }

      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background-color: #fff;
        color: #000;
        border-radius: 5px;
        font-size: 1.2em;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 2px;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .button:hover {
        background-color: #000;
        color: #fff;
        cursor: pointer;
      }

      /* QUINN portfolio entry */
      .hero-center {
        flex-direction: column;
        gap: 10px;
      }

      .quinn-entry {
        display: inline-flex;
        align-items: center;
        gap: 15px;
        padding: 12px 22px;
        color: #e4f9ef;
        border: 1px solid rgba(137, 219, 179, .28);
        border-radius: 999px;
        background: rgba(50, 125, 91, .08);
        font-size: .75rem;
        font-weight: 500;
        letter-spacing: .18em;
        text-transform: uppercase;
        text-shadow: none;
        text-decoration: none;
        transition: border-color .25s ease, background .25s ease, transform .25s ease;
      }

      .quinn-entry:hover, .quinn-entry:focus-visible {
        color: #fff;
        background: rgba(50, 125, 91, .18);
        border-color: rgba(156, 252, 202, .58);
        transform: translateY(-2px);
      }

      .quinn-entry small {
        color: rgba(183, 234, 204, .64);
        font-size: .65rem;
        letter-spacing: .14em;
      }

      @media (max-width: 480px) {
        .quinn-entry { padding: 12px 15px; gap: 10px; font-size: .7rem; }
        .quinn-entry small { font-size: .6rem; }
      }

    </style>
  </head>
  <body>
    <img src="logo.png" alt="Logo" class="logo">
    <div class="center hero-center">
      <a href="https://yng3.github.io/"><h1 class="animate__animated animate__fadeInDown">YNG3</h1></a>
      <a class="quinn-entry animate__animated animate__fadeInUp" href="/quinn/" aria-label="Explore QUINN project">
        <span>QUINN</span>
        <small>Explore project</small>
      </a>
    </div>
    <p class="animate__animated animate__fadeInUp">you have stumbled upon the realm of mystery and wonder. a quiet window into the systems, experiments, and discoveries currently taking shape.</p>

    
    <div class="footer">
      <p>&copy; 2026 YNG3</p>
      <p><a href="https://youtube.com/@ynotloc?si=pqxuKUOhRbvVTWKb">YouTube</a></p>
      <p>visit my <a href="https://github.com/YNG3">github</a> for all the latest hax</p>
    </div>

  </body>
</html>
